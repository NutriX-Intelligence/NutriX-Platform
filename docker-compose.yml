version: '3.8'

networks:
  nutrix-net:
    driver: bridge

volumes:
  nutrix-pgdata:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nutrix-pgdata:/var/lib/postgresql/data
    networks:
      - nutrix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nutrix-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nutrix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: nutrix-gateway
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - nutrix-net
    depends_on:
      - ms1-cv
      - ms2-llm
      - ms3-user
      - ms4-agents

  ms1-cv:
    build:
      context: .
      dockerfile: ms1_cv/Dockerfile
    container_name: nutrix-ms1-cv
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8001"
    networks:
      - nutrix-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ms2-llm:
    build:
      context: .
      dockerfile: ms2_llm/Dockerfile
    container_name: nutrix-ms2-llm
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8003"
    networks:
      - nutrix-net

  ms3-user:
    build:
      context: .
      dockerfile: ms3_user/Dockerfile
    container_name: nutrix-ms3-user
    restart: always
    env_file:
      - .env
    ports:
      - "8002:8002"
    networks:
      - nutrix-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ms4-agents:
    build:
      context: .
      dockerfile: ms4_agents/Dockerfile
    container_name: nutrix-ms4-agents
    restart: always
    env_file:
      - .env
    ports:
      - "8004:8004"
    networks:
      - nutrix-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
