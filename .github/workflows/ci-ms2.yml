name: CI - MS2 LLM Nutrition & Vision Service

on:
  push:
    paths:
      - 'ms2_llm/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'ms2_llm/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ms2_llm/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest ms2_llm/tests/ -v
