name: CI - MS1 CV & Ingestion Service

on:
  push:
    paths:
      - 'ms1_cv/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'ms1_cv/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ms1_cv/requirements.txt
      - name: Run tests
        run: pytest ms1_cv/tests/ -v
