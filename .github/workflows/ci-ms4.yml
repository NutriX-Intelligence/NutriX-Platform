name: CI - MS4 Multi-Agent System (MAS) Service

on:
  push:
    paths:
      - 'ms4_agents/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'ms4_agents/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ms4_agents/requirements.txt
      - name: Run tests
        run: pytest ms4_agents/tests/ -v
